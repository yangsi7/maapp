<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="maapp — your app as a typed knowledge graph AI agents query instead of reading source">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="24" y="24" width="1232" height="592" rx="20" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- graph motif (right) : edges drawn first, then nodes -->
  <g stroke="#3d444d" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="900" y1="188" x2="1024" y2="150"/>
    <line x1="1024" y1="150" x2="1128" y2="238"/>
    <line x1="1128" y1="238" x2="1060" y2="346"/>
    <line x1="900" y1="188" x2="908" y2="330"/>
    <line x1="908" y1="330" x2="1060" y2="346"/>
    <line x1="908" y1="330" x2="972" y2="452"/>
    <line x1="1060" y1="346" x2="1146" y2="428"/>
    <line x1="1024" y1="150" x2="908" y2="330"/>
  </g>
  <g stroke="#0d1117" stroke-width="4">
    <circle cx="900" cy="188" r="24" fill="#2f81f7"/>
    <circle cx="1024" cy="150" r="17" fill="#3fb950"/>
    <circle cx="1128" cy="238" r="21" fill="#a371f7"/>
    <circle cx="1060" cy="346" r="17" fill="#db6d28"/>
    <circle cx="908" cy="330" r="19" fill="#2f81f7"/>
    <circle cx="972" cy="452" r="14" fill="#a371f7"/>
    <circle cx="1146" cy="428" r="14" fill="#3fb950"/>
  </g>

  <!-- wordmark -->
  <text x="86" y="258" class="mono" font-size="150" font-weight="700" fill="#e6edf3" letter-spacing="-4">maapp</text>
  <rect x="92" y="286" width="330" height="8" rx="4" fill="#2f81f7"/>

  <!-- hero line -->
  <text x="92" y="356" class="sans" font-size="31" font-weight="500" fill="#adbac7">Your app as a typed knowledge graph</text>
  <text x="92" y="398" class="sans" font-size="31" font-weight="500" fill="#8b949e">AI agents query instead of reading source</text>

  <!-- chips -->
  <g>
    <rect x="92" y="452" width="92" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="138" y="483" class="mono" font-size="24" font-weight="600" fill="#58a6ff" text-anchor="middle">MIT</text>
    <rect x="200" y="452" width="108" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="254" y="483" class="mono" font-size="24" font-weight="600" fill="#e6edf3" text-anchor="middle">Rust</text>
  </g>
</svg>
