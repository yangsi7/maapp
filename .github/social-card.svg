<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="maapp — ask the graph before you break it: maapp query blast-radius store:CheckoutStore returns 10 dependents that break if the store changes">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="20" y="20" width="1240" height="600" rx="22" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- ================= HEADER BAND ================= -->
  <!-- wordmark -->
  <text x="64" y="156" class="mono" font-size="104" font-weight="800" fill="#e6edf3" letter-spacing="-4">maapp</text>
  <rect x="70" y="176" width="290" height="8" rx="4" fill="#2f81f7"/>

  <!-- tagline (the one message) -->
  <text x="548" y="116" class="sans" font-size="46" font-weight="700" fill="#e6edf3">Ask the graph</text>
  <text x="548" y="172" class="sans" font-size="46" font-weight="700" fill="#e6edf3">before you <tspan fill="#f0883e">break</tspan> it</text>

  <!-- ================= DEMO BAND ================= -->

  <!-- terminal card (left) -->
  <rect x="48" y="244" width="694" height="330" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <!-- title bar -->
  <line x1="48" y1="288" x2="742" y2="288" stroke="#30363d" stroke-width="2"/>
  <circle cx="76" cy="266" r="7" fill="#f85149"/>
  <circle cx="100" cy="266" r="7" fill="#e3b341"/>
  <circle cx="124" cy="266" r="7" fill="#3fb950"/>
  <text x="726" y="272" class="mono" font-size="16" fill="#6e7681" text-anchor="end">maapp query</text>

  <!-- command -->
  <text x="74" y="330" class="mono" font-size="20" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">maapp </tspan><tspan fill="#58a6ff">query blast-radius </tspan><tspan fill="#f0883e">store:CheckoutStore</tspan></text>

  <!-- output -->
  <text x="74" y="376" class="mono" font-size="19" xml:space="preserve"><tspan fill="#8b949e">BLAST-RADIUS </tspan><tspan fill="#f0883e">store:CheckoutStore</tspan></text>
  <text x="90" y="406" class="mono" font-size="18" xml:space="preserve"><tspan fill="#6e7681">DEPENDENTS (depend ON it; break if it changes) </tspan><tspan fill="#f0883e" font-weight="700">[10]</tspan></text>

  <text x="118" y="438" class="mono" font-size="18"><tspan fill="#2f81f7">screen:</tspan><tspan fill="#8b949e">checkout/Payment</tspan></text>
  <text x="118" y="468" class="mono" font-size="18"><tspan fill="#a371f7">comp:</tspan><tspan fill="#8b949e">checkout/AddressCard</tspan></text>
  <text x="118" y="498" class="mono" font-size="18"><tspan fill="#3fb950">act:</tspan><tspan fill="#8b949e">review/PlaceOrder</tspan></text>
  <text x="118" y="528" class="mono" font-size="18"><tspan fill="#3fb950">act:</tspan><tspan fill="#8b949e">pay/SelectMethod</tspan></text>
  <text x="118" y="558" class="mono" font-size="18"><tspan fill="#8b949e">assert:shipping/AddressPresent</tspan></text>

  <!-- graph motif (right) : blast radius lighting up -->
  <!-- faint heat disc -->
  <circle cx="992" cy="402" r="120" fill="#f0883e" opacity="0.05"/>
  <!-- shockwave rings -->
  <circle cx="992" cy="402" r="58" fill="none" stroke="#f0883e" stroke-width="2" opacity="0.5"/>
  <circle cx="992" cy="402" r="86" fill="none" stroke="#f0883e" stroke-width="1.5" opacity="0.28"/>

  <!-- blast edges (center -> dependents) -->
  <g stroke="#f0883e" stroke-width="3" opacity="0.85" stroke-linecap="round">
    <line x1="992" y1="402" x2="856" y2="352"/>
    <line x1="992" y1="402" x2="941" y2="261"/>
    <line x1="992" y1="402" x2="1072" y2="287"/>
    <line x1="992" y1="402" x2="1140" y2="376"/>
    <line x1="992" y1="402" x2="1118" y2="474"/>
    <line x1="992" y1="402" x2="1043" y2="543"/>
    <line x1="992" y1="402" x2="922" y2="523"/>
    <line x1="992" y1="402" x2="851" y2="453"/>
  </g>

  <!-- dependent nodes -->
  <g stroke="#0d1117" stroke-width="3">
    <circle cx="856" cy="352" r="14" fill="#2f81f7"/>
    <circle cx="941" cy="261" r="13" fill="#a371f7"/>
    <circle cx="1072" cy="287" r="14" fill="#3fb950"/>
    <circle cx="1140" cy="376" r="13" fill="#3fb950"/>
    <circle cx="1118" cy="474" r="13" fill="#8b949e"/>
    <circle cx="1043" cy="543" r="13" fill="#8b949e"/>
    <circle cx="922" cy="523" r="14" fill="#a371f7"/>
    <circle cx="851" cy="453" r="14" fill="#2f81f7"/>
  </g>

  <!-- central node: the store you are about to change -->
  <circle cx="992" cy="402" r="34" fill="#2f81f7" stroke="#f0883e" stroke-width="4"/>

  <!-- central label -->
  <rect x="882" y="448" width="220" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="992" y="469" class="mono" font-size="17" fill="#e6edf3" text-anchor="middle">store:CheckoutStore</text>
  <text x="992" y="505" class="mono" font-size="16" fill="#f0883e" text-anchor="middle" font-weight="700" stroke="#0d1117" stroke-width="4" paint-order="stroke">10 dependents light up</text>

  <!-- ================= FOOTER ================= -->
  <text x="64" y="600" class="sans" font-size="18" fill="#6e7681">The typed knowledge graph your coding agent queries instead of reading source. MIT · Rust.</text>
</svg>
