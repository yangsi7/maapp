# maapp CI — the verification spine as a merge gate (RES-001 §3).
# Blocking: fmt, clippy(-D warnings), nextest+doctests, cargo-deny, wasm build.
# Advisory (non-blocking): coverage, machete. `--locked` on every cargo call.
# NOTE: no remote yet (D-004). This file is staged; it activates when a remote is approved.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --all-features --locked
      - run: cargo test --doc --all-features --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      # L-006: wasm32 target must use --no-default-features to exclude the `cli` feature
      # (clap is native-only; the core library is wasm-clean by design).
      - run: cargo build --target wasm32-unknown-unknown --locked --no-default-features

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest --all-features --locked --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  machete:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory
    steps:
      - uses: actions/checkout@v4
      - uses: bnjbvr/cargo-machete@main
