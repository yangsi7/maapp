# dist-workspace.toml — release/distribution config for dist (axodotdev/cargo-dist).
#
# `dist init` re-reads this file and regenerates .github/workflows/release.yml;
# `dist plan` sanity-checks the whole setup locally. Note: the checked-in
# release.yml was hand-rendered from the dist v0.32.0 template, and the CI
# `dist plan` step fails if the workflow drifts from generated output — run
# `dist init` once with dist v0.32.0 to regenerate it after any config change.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in. Deliberately NOT dist's
# CARGO_HOME default: it matches install.sh (user-writable ~/.local/bin, no
# sudo), so both install paths agree on where maapp lives.
install-path = "~/.local/bin"
# Build and distribute release binaries via dist (the crates.io publish is a
# separate, later step, independent of these GitHub Release artifacts).
dist = true
